description = "Static file server for the frontend application"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "litestar>=2.24.0",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0",
    "cx-oracle>=8.3.0,<9.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "pyodbc>=5.0.0",
    "clickhouse-connect>=0.10",
]
